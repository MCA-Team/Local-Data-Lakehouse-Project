# Chart.yaml

apiVersion: v2
name: local-lakehouse-stack
description: A Helm chart for deploying the Local Lakehouse Stack
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  # Local charts
  - name: trino
    version: "1.42.2"
    repository: "file://../common/charts/trino"
    condition: trino.enabled
  
  - name: hue-modified
    version: "1.0.3"
    repository: "file://../common/charts/hue-modified"
    condition: hue-modified.enabled