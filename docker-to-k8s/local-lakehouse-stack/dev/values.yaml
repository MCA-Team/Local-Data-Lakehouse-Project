# Trino subchart values
trino:
  enabled: true

  image:
    tag: "479"

  server:
    workers: 2

  catalogs:
    minio_warehouse: |
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://minio:80/_iceberg
      iceberg.rest-catalog.warehouse=test-warehouse
      iceberg.rest-catalog.security=SIGV4
      iceberg.rest-catalog.vended-credentials-enabled=true
      iceberg.unique-table-location=true
      iceberg.rest-catalog.signing-name=s3tables
      iceberg.rest-catalog.view-endpoints-enabled=true
      iceberg.add-files-procedure.enabled=true
      iceberg.expire-snapshots.min-retention=5d
      iceberg.remove-orphan-files.min-retention=5d
      fs.native-s3.enabled=true
      s3.region=local
      s3.aws-access-key=minio
      s3.aws-secret-key=minio123
      s3.endpoint=http://minio:80
      s3.path-style-access=true
      fs.hadoop.enabled=false

  # Allowing the access to Trino web dashboard through 31205 port
  service:
    annotations: {}
    type: NodePort
    nodePort: "31205"


# hue-modified subchart values
hue-modified:
  enabled: true

  image:
    registry: "gethue"
    tag: "latest"
    pullPolicy: "Always"

  hue:
    replicas: 2
    database:
      create: true
      persist: true
      engine: "postgresql_psycopg2"
      host: "postgres-hue"
      port: 5432
      user: "hue"
      password: "hue"
      #password_script=echo ${DATABASE_PASSWORD}
      name: "hue"
      storageName: "microk8s-hostpath"
    interpreters: |
      [[[trino]]]
        name=Trino
        interface=trino
        options='{"url": "http://trino:8080/minio_warehouse/"}'
    ini: |
      [desktop]
      secret_key=hue123
      app_blacklist=hive,impala,security,search,pig,oozie,jobbrowser, hbase
      django_debug_mode=false
      gunicorn_work_class=sync
      enable_prometheus=true

      [[storage_connectors]]
        [[[minio_dev]]]
          provider=generic
          auth_type=key
          #Endpoint is built like this: http://{minio objectstore service name}:{service port} (use https if enabled for minio)
          endpoint=http://minio:80
          access_key_id=minio
          secret_key=minio123
          options={"signature_version": "s3v4"}

      [[task_server]]
      enabled=false
      broker_url=redis://redis:6379/0
      result_cache='{"BACKEND": "django_redis.cache.RedisCache", "LOCATION": "redis://redis:6379/0", "OPTIONS": {"CLIENT_CLASS": "django_redis.client.DefaultClient"},"KEY_PREFIX": "queries"}'
      celery_result_backend=redis://redis:6379/0