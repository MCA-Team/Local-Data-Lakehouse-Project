models:
  - name: silver_table
    description: "This is the silver table created from the raw parquet files in the MinIO bronze bucket. It contains the same data as the raw parquet files but with a defined schema and partitioned by transaction_date."
    columns:
      - name: transaction_id
        description: "The unique identifier for each transaction."
        data_test:
          - not_null
          - unique
      - name: transaction_date
        description: "The date and time when the transaction occurred."
      - name: client_name
        description: "The name of the client who made the transaction."
      - name: item_product_name
        description: "The name of the product that was purchased in the transaction."
      - name: item_quantity
        description: "The quantity of the product that was purchased in the transaction."
      - name: item_unit_price
        description: "The unit price of the product that was purchased in the transaction."
      - name: total_amount
        description: "The total amount of the purchased product_name (calculated as item_quantity * item_unit_price)."
      - name: transaction_currency
        description: "The currency in which the transaction was made (e.g., USD, EUR, etc.)."
      - name: payment_method
        description: "The method of payment used for the transaction (e.g., credit card, cash, etc.)."
      - name: ingestion_date
        description: "The date when the transaction data was ingested into the silver table."
        data_test:
          - not_null