[desktop]
    secret_key=
    http_host=0.0.0.0
    http_port=8888
    time_zone=Europe/Paris
    # Enable or disable backtrace for server error
    http_500_debug_mode=false
    app_blacklist=hive,impala,security,search,pig,oozie,jobbrowser, hbase

    [[storage_connectors]]
        [[[minio_dev]]]
            provider=generic
            auth_type=key
            endpoint=http://minio-aistor-server:9008
            # MinIO Access ID (Username)
            access_key_id=
            # MinIO Secret Key (Password)
            secret_key=
            bucket_configs={"bronze": {"default_home_path": "/"}}
            options={"signature_version": "s3v4"}

    [[database]]
        # Database engine is typically one of:
        # postgresql_psycopg2, mysql, sqlite3 or oracle.
        # Note that for sqlite3, 'name', below is a path to the filename. For other backends, it is the database name
        # Note for Oracle, options={"threaded":true} must be set in order to avoid crashes.
        # Note for Oracle, you can use the Oracle Service Name by setting "host=" and "port=" and then "name=<host>:<port>/<service_name>".
        # Note for MariaDB use the 'mysql' engine.
        engine=postgresql_psycopg2
        host=airflow-metadata-db
        port=5432
        user=airflow
        password=airflowpass
        name=airflow
        # conn_max_age option to make database connection persistent value in seconds
        # https://docs.djangoproject.com/en/1.11/ref/databases/#persistent-connections
        ## conn_max_age=0
        # Execute this script to produce the database password. This will be used when 'password' is not set.
        ## password_script=/path/script
        ## name=desktop/desktop.db
        ## options={}
        # Database schema, to be used only when public schema is revoked in postgres
        ## schema=public

    [[interpreters]]
        [[[trino]]]
            name=Trino
            interface=sqlalchemy
            # Format: trino://user@host:port/catalog/schema
            options='{"url": "trino://admin@trino-engine:8080/minio_warehouse/"}'


[dashboard]
    # Activate the SQL Dashboard (beta).
    has_sql_enabled=true


