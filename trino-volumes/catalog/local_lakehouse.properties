connector.name=iceberg

# MinIO Aistor Iceberg Tables REST Catalog configuration
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://minio-aistor-server:9008/_iceberg
iceberg.rest-catalog.warehouse=local_lakehouse
iceberg.rest-catalog.security=SIGV4
iceberg.rest-catalog.vended-credentials-enabled=true
iceberg.unique-table-location=true
iceberg.rest-catalog.signing-name=s3tables
iceberg.rest-catalog.view-endpoints-enabled=true
iceberg.add-files-procedure.enabled=true

# Credentials and connection settings for MinIO (used as the storage backend for Iceberg tables and for storing raw JSON files in the Bronze bucket)
fs.native-s3.enabled=true
s3.region=local
s3.aws-access-key=
s3.aws-secret-key=
s3.endpoint=http://minio-aistor-server:9008
s3.path-style-access=true
fs.hadoop.enabled=false