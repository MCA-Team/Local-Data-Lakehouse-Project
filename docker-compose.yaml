# -------------------------------APACHE AIRFLOW----------------------------------
# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:2.7.1
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
# LOCAL_DATA_DIR               - Path to the local directory where raw json files will be uploaded for ingestion in the Bronze bucket. 
#                                Mount as a volume to "/opt/airflow/local-data" internal directory inside airflow containers
#
# Feel free to modify this file to suit your needs.
# -------------------------------APACHE AIRFLOW----------------------------------
---

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: dockerfile.airflow
  entrypoint: /bin/bash
  command:
    - -c
    - |
      # Creation of the in-memory connection string variable before launching Airflow (the variable is invisible in "docker inspect" output)
      export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=$$(cat /run/secrets/sql_alchemy_connection_string_secret)
      sleep 2
      exec /entrypoint airflow $${AIRFLOW_COMMAND}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    # AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    # _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-} 
  volumes:
    - ${AIRFLOW_PROJ_DIR}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR}/plugins:/opt/airflow/plugins
    - ${LOCAL_DATA_DIR}:/opt/airflow/local-data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    # redis:
    #   condition: service_healthy
    airflow-metadata-db:
      condition: service_healthy
  secrets:
    - sql_alchemy_connection_string_secret


# -------------------------------APACHE SUPERSET----------------------------------------
# Superset doesn't support docker compose for production environments.
# If you choose to use this type of deployment make sure to
# create you own docker environment file (docker/.env) with your own
# unique random secure passwords and SECRET_KEY.
# -------------------------------APACHE SUPERSET----------------------------------------
x-superset-core-common: 
  &superset-core-common
  image: apachesuperset.docker.scarf.sh/apache/superset:${SUPERSET_IMAGE_TAG:-latest-dev}
  volumes:
  # "/app/pythonpath_docker" will be appended to the PYTHONPATH in the final container
  - ./superset-volumes:/app/docker
  - ./superset-volumes/superset_home:/app/superset_home
  environment:
    &superset-core-common-env
    SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
  secrets:
    - superset_postgres_password


# -------------------------------MINIO AISTOR----------------------------------
# MinIO AIStor common environment variables used by data storage containers
# -------------------------------MINIO AISTOR----------------------------------
x-minio-common:
  &minio-common-env
  env_file:
      - path: "./minio-volumes/minio_variables.env"
        required: true
  environment:
    MINIO_ROOT_PASSWORD_FILE: "/run/secrets/minio_root_passwd"
  secrets:
      - minio_root_passwd
  

# ************************************** DOCKER SERVICES **************************************
services:
# ================================= DATA ORCHESTRATION WITH APACHE AIRFLOW =================================
  airflow-metadata-db:
    env_file:
      - path: "./airflow-volumes/airflow_metadata_postgres_variables.env"
        required: true
    image: postgres:15
    hostname: local-lakehouse-airflow-metadata-db
    environment:
      POSTGRES_PASSWORD_FILE: "/run/secrets/airflow_metadata_postgres_password"
    container_name: airflow-metadata-postgres
    ports:
      - 5432:5432
    volumes:
      - ./airflow-volumes/metadata-postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    secrets:
      - airflow_metadata_postgres_password

  airflow-webserver:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      AIRFLOW_COMMAND: "webserver"
    ports:
      - "8080:8080"
    container_name: airflow-webserver
    hostname: local-lakehouse-airflow-webserver
    image: airflow-webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      AIRFLOW_COMMAND: "scheduler"
    hostname: local-lakehouse-airflow-scheduler
    container_name: airflow-scheduler
    image: airflow-scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://airflow-scheduler:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      AIRFLOW_COMMAND: "triggerer"
    hostname: local-lakehouse-airflow-triggerer
    container_name: airflow-triggerer
    image: airflow-triggerer
    healthcheck:
      test: [
              "CMD-SHELL", 
              'export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=$$(cat /run/secrets/sql_alchemy_connection_string_secret) && 
              airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"'
            ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    env_file:
      - path: "./airflow-volumes/airflow_core_variables.env"
        required: true
    container_name: airflow-init
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        # function ver() {
        #   printf "%04d%04d%04d%04d" $${1//./ }
        # }
        # airflow_version=$$(AIRFLOW__LOGGING__LOGGING_LEVEL=INFO && gosu airflow airflow version)
        # airflow_version_comparable=$$(ver $${airflow_version})
        # min_airflow_version=2.2.0
        # min_airflow_version_comparable=$$(ver $${min_airflow_version})
        # if (( airflow_version_comparable < min_airflow_version_comparable )); then
        #   echo
        #   echo -e "\033[1;31mERROR!!!: Too old Airflow version $${airflow_version}!\e[0m"
        #   echo "The minimum Airflow version supported: $${min_airflow_version}. Only use this or higher!"
        #   echo
        #   exit 1
        # fi
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        
        # Defining an in-memory Connection string variable
        export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=$$(cat /run/secrets/sql_alchemy_connection_string_secret)
        if [[ -f /run/secrets/airflow_www_user_password_secret ]]; then
          export _AIRFLOW_WWW_USER_PASSWORD=$(cat /run/secrets/airflow_www_user_password_secret)
          echo "Airflow www user password successfully created !"
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow db migrate
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      # _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR}:/sources
    secrets:
      - airflow_www_user_password_secret
      - sql_alchemy_connection_string_secret

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow

  # redis:
  #   image: redis:latest
  #   expose:
  #     - 6379
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 30s
  #     retries: 50
  #     start_period: 30s
  #   restart: always

  # airflow-worker:
  #   <<: *airflow-common
  #   healthcheck:
  #     # yamllint disable rule:line-length
  #     test:
  #       - "CMD-SHELL"
  #       - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   environment:
  #     <<: *airflow-common-env
  #     AIRFLOW_COMMAND: "celery worker"
  #     # Required to handle warm shutdown of the celery workers properly
  #     # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
  #     DUMB_INIT_SETSID: "0"
  #   hostname: local-lakehouse-airflow-worker
  #   container_name: airflow-worker
  #   restart: always
  #   depends_on:
  #     <<: *airflow-common-depends-on
  #     airflow-init:
  #       condition: service_completed_successfully


  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  # flower:
  #   <<: *airflow-common
  #   command: celery flower
  #   profiles:
  #     - flower
  #   ports:
  #     - "5555:5555"
  #   healthcheck:
  #     test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   restart: always
  #   depends_on:
  #     <<: *airflow-common-depends-on
  #     airflow-init:
  #       condition: service_completed_successfully


# ================================= DATA STORAGE WITH MINIO AISTOR =================================

  minio-aistor-server:
    image: quay.io/minio/aistor/minio:RELEASE.2026-02-07T07-43-34Z
    container_name: minio-aistor-server
    hostname: local-lakehouse-minio-aistor-server
    restart: always
    <<: *minio-common-env
    ports:
      - "${MINIO_API_PORT:-9000}:${MINIO_API_PORT:-9000}"
      - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - ${MINIO_PROJ_DIR}/data:/mnt/data
      - ${MINIO_PROJ_DIR}/minio.license:/minio.license
      - ${MINIO_PROJ_DIR}/certs:/etc/minio/certs
    command: [
              "minio", "server", "/mnt/data", 
              "--console-address", ":${MINIO_CONSOLE_PORT}", 
              "--address", ":${MINIO_API_PORT}", 
              "--license", "/minio.license"
              ]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://minio-aistor-server:${MINIO_API_PORT}/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    

  minio-autocreate-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-autocreate-buckets
    <<: *minio-common-env
    depends_on:
      - minio-aistor-server
    entrypoint: >
      /bin/sh -c "
      sleep 5;

      mc alias set local-lakehouse http://minio-aistor-server:${MINIO_API_PORT} $${MINIO_ROOT_USER} $$(cat $$MINIO_ROOT_PASSWORD_FILE);
      mc mb --ignore-existing local-lakehouse/$${MINIO_BRONZE_BUCKET_NAME};
      mc mb --ignore-existing local-lakehouse/$${MINIO_SILVER_BUCKET_NAME};
      mc mb --ignore-existing local-lakehouse/$${MINIO_GOLD_BUCKET_NAME};
      exit 0;
      "
    restart: on-failure

  trino-engine:
    image: trinodb/trino:479
    container_name: trino-engine
    hostname: local-lakehouse-trino-engine
    restart: always
    user: "root"
    ports:
      - "8081:8080"
    environment:
      - TRINO_SINGLE_NODE=true
      - CATALOG_MANAGEMENT=dynamic
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    volumes:
      - ./trino-volumes/catalog:/etc/trino/catalog/
      - trino-temp-metastore:/tmp/trino-hive-metastore
      # - ./trino-volumes/config.properties:/etc/trino/config.properties

      
# ================================= BI WITH APACHE SUPERSET =================================

  superset-cache-database:
      image: redis:7
      container_name: superset-cache-redis
      hostname: local-lakehouse-superset-cache-database
      ports:
        - "${REDIS_PORT}:${REDIS_PORT}"
      healthcheck:
        test: ["CMD", "redis-cli", "--raw", "ping", "Redis is healthy"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 5s
      restart: unless-stopped
      volumes:
        - ./superset-volumes/cache-redis-volume:/data

  superset-metadata-db:
    env_file:
      - path: ./superset-volumes/superset_metadata_postgres_variables.env
        required: true
    image: postgres:15
    container_name: superset-metadata-postgres
    hostname: local-lakehouse-superset-metadata-db
    ports:
      - "5433:${DATABASE_PORT}"
    environment:
      POSTGRES_PASSWORD_FILE: "/run/secrets/superset_postgres_password"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - ./superset-volumes/metadata-postgres-volume:/var/lib/postgresql/data
      - ./superset-volumes/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    secrets:
      - superset_postgres_password

  superset:
    <<: *superset-core-common
    env_file:
      - path: ./superset-volumes/superset_core_variables.env
        required: true
    container_name: superset-webapp
    hostname: local-lakehouse-superset-webapp
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    ports:
      - "${SUPERSET_PORT:-8088}:${SUPERSET_PORT:-8088}"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://superset:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  superset-init:
    <<: *superset-core-common
    container_name: superset-init
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: ./superset-volumes/superset_core_variables.env
        required: true
    depends_on:
      superset-metadata-db:
        condition: service_started
      superset-cache-database:
        condition: service_started
    user: "root"
    healthcheck:
      disable: true
    secrets:
      - superset_postgres_password
      - superset_admin_password

  superset-worker:
    <<: *superset-core-common
    container_name: superset-worker
    hostname: local-lakehouse-superset-worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: ./superset-volumes/superset_core_variables.env
        required: true
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"
        ]

  superset-worker-beat:
    <<: *superset-core-common
    container_name: superset-worker-beat
    hostname: local-lakehouse-superset-worker-beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file:
      - path: ./superset-volumes/superset_core_variables.env
        required: true
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    healthcheck:
      disable: true
    


# ************************************** DOCKER SECRETS **************************************
secrets:
  sql_alchemy_connection_string_secret:
    file: "./docker-secrets/airflow/airflow_sql_alchemy_connection_string.secrets"
  airflow_www_user_password_secret:
    file: "./docker-secrets/airflow/airflow_www_user_password.secrets"
  airflow_metadata_postgres_password:
    file: "./docker-secrets/airflow/airflow_metadata_postgres_password.secrets"
  minio_root_passwd:
    file: "./docker-secrets/minio/minio_root_passwd.secrets"
  superset_postgres_password:
    file: "./docker-secrets/superset/superset_postgres_password.secrets"
  superset_admin_password:
    file: "./docker-secrets/superset/superset_admin_password.secrets"

volumes:
  trino-temp-metastore: